<!-- Cinder Launcher — official mark. Original artwork: "cinder cube".
  An isometric ember cube: mint-lit top, deep-teal left face, charred right
  face split by a molten crack. No Mojang assets used. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Cinder launcher logo">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16242b"/>
      <stop offset="0.55" stop-color="#0c1419"/>
      <stop offset="1" stop-color="#070c10"/>
    </linearGradient>
    <linearGradient id="c-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8affd8"/>
      <stop offset="0.5" stop-color="#3ef2b6"/>
      <stop offset="1" stop-color="#14c38a"/>
    </linearGradient>
    <linearGradient id="c-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a40"/>
      <stop offset="1" stop-color="#0b1f1b"/>
    </linearGradient>
    <linearGradient id="c-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/>
      <stop offset="1" stop-color="#121619"/>
    </linearGradient>
    <linearGradient id="c-crack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="0.55" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff5f3c"/>
    </linearGradient>
    <filter id="c-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="c-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#c-bg)"/>
  <rect x="2.75" y="2.75" width="90.5" height="90.5" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="2" y="2" width="92" height="46" rx="24" fill="#ffffff" opacity="0.045"/>
  <!-- ambient ember glow under cube -->
  <ellipse cx="48" cy="74" rx="26" ry="7" fill="#ff8a3c" opacity="0.16" filter="url(#c-soft)"/>
  <ellipse cx="48" cy="73" rx="15" ry="4" fill="#3ef2b6" opacity="0.14" filter="url(#c-soft)"/>

  <!-- isometric cube -->
  <g stroke-linejoin="round">
    <!-- left face -->
    <polygon points="28,40 48,51 48,73 28,62" fill="url(#c-left)" stroke="#0a1512" stroke-width="1.5"/>
    <!-- left face bevel light -->
    <polyline points="28,40 48,51 48,73" fill="none" stroke="#3ef2b6" stroke-opacity="0.28" stroke-width="1"/>
    <!-- right face -->
    <polygon points="68,40 48,51 48,73 68,62" fill="url(#c-right)" stroke="#05080a" stroke-width="1.5"/>
    <!-- right face top edge light -->
    <polyline points="68,40 48,51" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
    <!-- top face -->
    <polygon points="48,27 68,40 48,51 28,40" fill="url(#c-top)" stroke="#06281e" stroke-width="1.5"/>
    <!-- top facet cut: darker inner diamond for depth -->
    <polygon points="48,32.5 61,40 48,46.5 35,40" fill="#06281e" opacity="0.18"/>
    <!-- top highlight -->
    <polyline points="35,38.5 48,32.5 61,38.5" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- molten crack on the right face -->
  <g filter="url(#c-glow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="60,44 56.5,50 60,53.5 55.5,60 57.5,66" stroke="url(#c-crack)" stroke-width="2.6"/>
    <polyline points="60,53.5 63,55.5" stroke="url(#c-crack)" stroke-width="1.6"/>
  </g>
  <!-- crack hot core -->
  <polyline points="60,44 56.5,50 60,53.5 55.5,60 57.5,66" fill="none" stroke="#fff3d6" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- left-face etched strata (subtle craft lines) -->
  <g stroke="#3ef2b6" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round">
    <line x1="33" y1="49" x2="44" y2="55.2"/>
    <line x1="33" y1="54" x2="44" y2="60.2"/>
  </g>

  <!-- sparks -->
  <g filter="url(#c-glow)">
    <path d="M70 22.5l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#ffd479"/>
    <path d="M24 24l1.1 2.6 2.6 1.1-2.6 1.1-1.1 2.6-1.1-2.6-2.6-1.1 2.6-1.1z" fill="#7dffd2"/>
  </g>
</svg>
