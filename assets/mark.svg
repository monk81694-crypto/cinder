<!-- Cinder Launcher — compact mark (transparent tile). Reuse of the cinder cube, no background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Cinder mark">
  <defs>
    <linearGradient id="m-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8affd8"/>
      <stop offset="0.5" stop-color="#3ef2b6"/>
      <stop offset="1" stop-color="#14c38a"/>
    </linearGradient>
    <linearGradient id="m-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a40"/>
      <stop offset="1" stop-color="#0b1f1b"/>
    </linearGradient>
    <linearGradient id="m-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3138"/>
      <stop offset="1" stop-color="#121619"/>
    </linearGradient>
    <linearGradient id="m-crack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="0.55" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff5f3c"/>
    </linearGradient>
    <filter id="m-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g stroke-linejoin="round">
    <polygon points="28,40 48,51 48,73 28,62" fill="url(#m-left)" stroke="#0a1512" stroke-width="1.5"/>
    <polygon points="68,40 48,51 48,73 68,62" fill="url(#m-right)" stroke="#05080a" stroke-width="1.5"/>
    <polygon points="48,27 68,40 48,51 28,40" fill="url(#m-top)" stroke="#06281e" stroke-width="1.5"/>
    <polygon points="48,32.5 61,40 48,46.5 35,40" fill="#06281e" opacity="0.18"/>
    <polyline points="35,38.5 48,32.5 61,38.5" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g filter="url(#m-glow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="60,44 56.5,50 60,53.5 55.5,60 57.5,66" stroke="url(#m-crack)" stroke-width="2.6"/>
  </g>
  <polyline points="60,44 56.5,50 60,53.5 55.5,60 57.5,66" fill="none" stroke="#fff3d6" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <g filter="url(#m-glow)">
    <path d="M70 22.5l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#ffd479"/>
  </g>
</svg>
