[package]
name = "cinder-launcher"
version = "3.0.0"
edition = "2021"
authors = ["radoslavgeme"]
description = "Cinder v3.0 — Rust/Tauri Minecraft Launcher"
license = "Proprietary"
categories = ["gui", "game-development"]
keywords = ["minecraft", "launcher", "tauri", "rust"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.6", features = [
    "macos-private-api",
    "system-tray",
    "global-shortcut",
    "dialog",
    "clipboard-manager",
    "fs-all",
    "shell-all",
    "process-all",
    "protocol-all",
    "updater",
    "isolation",
] }
tauri-plugin-store = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-shell = "3.0.0-alpha.3"
tauri-plugin-dialog = "3.0.0-alpha.3"
tauri-plugin-fs = "3.0.0-alpha.3"
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
tauri-plugin-global-shortcut = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-sql = { version = "3.0.0-alpha.3", features = ["sqlite"] }
tauri-plugin-opener = "3.0.0-alpha.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }
async-trait = "0.1.83"
thiserror = "2.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "gzip"] }
url = "2.5"
uuid = { version = "1.8", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1.0"
directories = "5.0"
walkdir = "2.5"
notify = { version = "6.1.1", features = ["mio"] }
zip = "9.6"
sysinfo = "0.30"
which = "5.0"
home = "0.5"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rmp-serde = "1.1"
bincode = "1.3"
dashmap = "6.1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "json"] }
config = "0.14"
valico = "0.3"
regex = "1.10"
lazy_static = "1.4"
once_cell = "1.19"
futures = "0.3"
stream = "0.1"
bytes = "1.5"
mime = "0.3"
mime_guess = "2.0"
percent-encoding = "2.3"
idna = "0.5"
publicsuffix = "2.3"
cookie = "0.16"
cookie_store = "0.22"
http = "1.1"
hyper = "1.4"
tower = "0.4"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-full"] }
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
socket2 = "0.5"
native-tls = "0.2"
rustls = "0.23"
rustls-pemfile = "1.0"
webpki-roots = "0.26"
pem = "1.0"
x509-parser = "0.16"
der-parser = "9.0"
nom = "7.1"
bitflags = "2.5"
strum = { version = "0.26", features = ["derive"] }
enumflags2 = "0.7"
smallvec = "1.13"
arrayvec = "0.7"
indexmap = "2.2"
hashbrown = "0.14"
ahash = "0.8"
fxhash = "0.2"
tinystr = "0.3"