# Cinder Client — version pins (verified 2026-09-20 against live metadata).
# Supports multiple MC versions via gradle -PmcVersion=1.21.11 (default)
# Supported: 1.21.11, 1.21.2, 1.21.3, 1.21.4, 1.21.5
# MC 26.x has no published mappings (Mojang ships it unobfuscated, Yarn
# deprecated), so the client targets stable versions WITH mappings.

# Default version (override with -PmcVersion=1.21.5)
mcVersion=1.21.11

# Version-specific pins (auto-selected based on mcVersion)
# 1.21.11: yarn 1.21.11+build.6, fabric 0.141.6+1.21.11
# 1.21.5:  yarn 1.21.5+build.1,   fabric 0.141.6+1.21.5
# 1.21.4:  yarn 1.21.4+build.1,   fabric 0.141.6+1.21.4
# 1.21.3:  yarn 1.21.3+build.1,   fabric 0.141.6+1.21.3
# 1.21.2:  yarn 1.21.2+build.1,   fabric 0.141.6+1.21.2

# Computed from mcVersion (do not edit manually)
yarn_mappings=1.21.11+build.6
fabric_version=0.141.6+1.21.11
minecraft_version=1.21.11

loader_version=0.19.3
loom_version=1.17.21
mod_version=1.0.0
maven_group=gg.cinder
archives_base_name=cinder-client
org.gradle.jvmargs=-Xmx3G