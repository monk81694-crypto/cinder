# Cinder Client — version pins (verified 2026-09-20 against live metadata).
# MC 26.x has no published mappings (Mojang ships it unobfuscated, Yarn
# deprecated), so the client targets the newest stable WITH mappings: 1.21.11.
#  - minecraft_version: 1.21.11 stable release.
#  - yarn_mappings: 1.21.11+build.6 (meta.fabricmc.net, live check).
#  - loader_version: 0.19.3 (game-agnostic line).
#  - fabric_version: 0.141.6+1.21.11 (CurseForge release file).
#  - loom_version: newest 1.17.x.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11
loom_version=1.17.21
mod_version=1.0.0
maven_group=gg.cinder
archives_base_name=cinder-client
# Increase Gradle heap for Loom remapping work.
org.gradle.jvmargs=-Xmx3G
