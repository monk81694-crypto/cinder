// Cinder Client — Fabric mod build (Loom). Original build file (MIT).
// Client-only mod: no splitEnvironmentSourceSets(); the client-only nature is
// declared via "environment": "client" in src/main/resources/fabric.mod.json.
// Supports multiple MC versions: 1.21.11, 1.21.2-1.21.5 via -PmcVersion=X.Y.Z
plugins {
    id 'java'
    id 'fabric-loom' version '1.17.21' // literal required here (plugins DSL forbids property refs); keep in sync with loom_version in gradle.properties
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Dynamic version resolution based on -PmcVersion=X.Y.Z
// Defaults to 1.21.11 if not specified
ext {
    mcVersion = project.hasProperty('mcVersion') ? project.mcVersion : '1.21.11'
    // Version-specific pins (auto-computed)
    yarnMappings = [
        '1.21.11': '1.21.11+build.6',
        '1.21.5' : '1.21.5+build.1',
        '1.21.4' : '1.21.4+build.1',
        '1.21.3' : '1.21.3+build.1',
        '1.21.2' : '1.21.2+build.1',
    ]
    fabricApi = [
        '1.21.11': '0.141.6+1.21.11',
        '1.21.5' : '0.141.6+1.21.5',
        '1.21.4' : '0.141.6+1.21.4',
        '1.21.3' : '0.141.6+1.21.3',
        '1.21.2' : '0.141.6+1.21.2',
    ]
    minecraftVersion = mcVersion
    yarnMappings = yarnMappings[mcVersion] ?: '1.21.11+build.6'
    fabricVersion  = fabricApi[mcVersion] ?: '0.141.6+1.21.11'
}

java {
    // Use available JDK 25 with --release 21 for Java 21 bytecode compatibility
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    // Standard single-source-set layout; client-only enforced by fabric.mod.json.
}

tasks.withType(Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}